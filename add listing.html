<div class="container">
    <h2>Create a Listing</h2>
    <form id="propertyForm">
        <input type="text" id="title" placeholder="Property Title" required>
        <textarea id="description" placeholder="Property Description" required></textarea>
        <input type="text" id="price" placeholder="Price" required>
        <button type="submit">Add Property</button>
    </form>

    <script>    

        document.getElementById("propertyForm").addEventListener("submit", function(event) {
            event.preventDefault();
            let title = document.getElementById("title").value.trim();
            let description = document.getElementById("description").value.trim();
            let price = document.getElementById("price").value.trim();
            
            if (!title || !description || !price) {
                alert("Please fill out all fields.");
                return;
            }
            
            let propertyList = document.getElementById("propertyList");
            let newProperty = document.createElement("div");
            newProperty.classList.add("property-item");
            newProperty.innerHTML = `<h3>${title}</h3><p>${description}</p><p><strong>Price:</strong> ${price}</p>
                                     <button class="remove-btn">Remove</button>`;
            propertyList.appendChild(newProperty);
            
            document.getElementById("propertyForm").reset();
        });
        
        document.getElementById("propertyList").addEventListener("click", function(event) {
            if (event.target.classList.contains("remove-btn")) {
                event.target.parentElement.remove();
            }
        });
        </script>
